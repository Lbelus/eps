# Restricted YAML-like config format.
# Supported shape:
# section:
#   key: value

server:
  host: mysqlserver
  # bind_addr: 127.0.0.1   # use loopback only when nginx and rest_api run on the SAME host (path A)
  # bind_addr: 0.0.0.0     # default when omitted; required when the API runs inside a container and nginx reaches it via published port or service name
  port: 3004
  threads: 4
  allowed_origins: https://eps.example.com

mysql:
  host: test_rest_DB
  port: 18080
  user: dev_admin
  password: MYSQL_PASSWORD
  database: rest_api
  pool_size: 8
