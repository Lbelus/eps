# TLS-terminating reverse proxy for the EPS REST API.
#
# Provision certs with certbot before reloading nginx:
#   sudo certbot --nginx -d api.eps.example.com
#
# Then drop this file at /etc/nginx/sites-available/eps_rest_api.conf and:
#   sudo ln -s /etc/nginx/sites-available/eps_rest_api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace api.eps.example.com with your real hostname.
# The Crow app is bound to 127.0.0.1:3004 in config.yaml so it is not reachable
# directly from the public network — only this nginx server can reach it.

server {
    listen 80;
    listen [::]:80;
    server_name api.eps.example.com;

    # ACME http-01 challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.eps.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.eps.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.eps.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }
}
