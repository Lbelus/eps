documents:
  EFTA:
    match: "^EFTA........\\.json$"
    parse_title: false
    tokens:
      # Extract all EFTA document reference numbers embedded per page (e.g. EFTA00008998)
      - label: "cross ETFA REF"
        patterns:
          - "efta"
          - "EFTA"
        method: "kmp"
        extract_after: 8
        merge: false

      # Court district (e.g. "SOUTHERN DISTRICT OF NEW YORK")
      - label: "COURT_DISTRICT"
        pattern: "((?:SOUTHERN|NORTHERN|EASTERN|WESTERN)\\s+DISTRICT\\s+OF\\s+(?:[A-Z]+(?:\\s+[A-Z]+)*))"
        method: "regex"
        group: 1
        merge: true

      # Case number (e.g. "20 Cr. 330 (AJN)")
      - label: "CASE_NUMBER"
        pattern: "(\\d{2}\\s+Cr\\.\\s+\\d+\\s+\\([A-Z]+\\))"
        method: "regex"
        group: 1
        merge: true

      # Document type: prefer SUPERSEDING INDICTMENT over plain INDICTMENT
      - label: "DOCUMENT_TYPE"
        pattern: "(SUPERSEDING INDICTMENT|INDICTMENT)"
        method: "regex"
        group: 1
        merge: true

      # Defendant name from formal caption (e.g. "GHISLAINE MAXWELL, Defendant.")
      - label: "DEFENDANT_NAME"
        pattern: "([A-Z][A-Z]+(?:\\s+[A-Z]+)+),\\s*Defendant"
        method: "regex"
        group: 1
        merge: true

      # Civil docket number referenced in perjury counts (e.g. "15 Civ. 7433")
      - label: "DOCKET_NUMBER"
        pattern: "docket number\\s+(\\d+\\s+Civ\\.\\s+\\d+)"
        method: "regex"
        group: 1
        merge: true

      # US Attorney who signed the indictment (2-word name before title)
      - label: "US_ATTORNEY"
        pattern: "([A-Z][A-Z]+\\s+[A-Z][A-Z]+)\\s+Acting\\s+United\\s+States\\s+Attorney"
        method: "regex"
        group: 1
        merge: true

      # Dates: month-name format used in depositions (e.g. "April 22, 2016")
      # Fallback patterns cover numeric formats from other document variants
      - label: "DATE_FALLBACK"
        patterns:
          - "((?:January|February|March|April|May|June|July|August|September|October|November|December)\\s+\\d{1,2},\\s+\\d{4})"
          - "Date\\s*:?\\s*(\\d{2}/\\d{2}/\\d{4})"
          - "Date\\s*:?\\s*(\\d{1,2}\\s+\\w+\\s+\\d{4})"
          - "Dated\\s*:?\\s*(\\d{2}-\\d{2}-\\d{4})"
        method: "regex"
        group: 1
        merge: false

      # Count labels (COUNT ONE through COUNT TEN)
      - label: "COUNT_LABELS"
        pattern: "(COUNT\\s+(?:ONE|TWO|THREE|FOUR|FIVE|SIX|SEVEN|EIGHT|NINE|TEN))"
        method: "regex"
        group: 1
        merge: false

      # Title 18 U.S.C. section numbers cited (e.g. "2422", "2423(a)", "371")
      - label: "TITLE_18_CITATIONS"
        pattern: "Title\\s+18,\\s+United\\s+States\\s+Code,\\s+Section\\s+(\\d+[a-z]?(?:\\([a-z0-9]+\\))?)"
        method: "regex"
        group: 1
        merge: false

      # Bates numbers stamped on each page (e.g. "GM_GJ_SDNY_00000470")
      - label: "BATES_NUMBERS"
        pattern: "(GM_GJ_SDNY_\\d+)"
        method: "regex"
        group: 1
        merge: false
