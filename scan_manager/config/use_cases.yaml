documents:

  # ===========================================================================
  # 1) MINIMAL: simplest possible document + simplest possible token
  # ===========================================================================
  minimal_document:
    match: "^MIN_.*\\.json$"
    parse_title: false
    tokens:
      - label: "ID_SIMPLE"
        pattern: "ID\\s*:?\\s*([A-Z0-9_-]+)"
        method: "regex"
        group: 1
        merge: true


  # ===========================================================================
  # 2) KMP CASES: pattern vs patterns, with/without extract_after, merge true/false
  # ===========================================================================
  kmp_showcase:
    match: "^KMP_.*\\.json$"
    parse_title: true
    tokens:
      # 2a) Single anchor string (pattern) + extract_after: common "read value after label"
      - label: "FIELD_AFTER_ANCHOR"
        pattern: "Reference :"
        method: "kmp"
        extract_after: 20
        merge: true

      # 2b) Multiple anchors (patterns) for OCR/typing variants
      - label: "FIELD_AFTER_ANY_ANCHOR"
        patterns:
          - "Référence :"
          - "Reference:"
          - "Ref :"
        method: "kmp"
        extract_after: 20
        merge: true

      # 2c) KMP as a "presence marker" (extract_after=0) with merge=false (multi-hits)
      - label: "MARKER_OCCURRENCES"
        pattern: "APPROVED"
        method: "kmp"
        extract_after: 0
        merge: false


  # ===========================================================================
  # 3) REGEX BASICS: single pattern, group, strip_spaces, merge
  # ===========================================================================
  regex_basics:
    match: "^REG_.*\\.json$"
    parse_title: true
    tokens:
      # 3a) Capture group 1 (typical)
      - label: "CODE_ALPHANUM"
        pattern: "Code\\s*:?\\s*([A-Z0-9_-]+)"
        method: "regex"
        group: 1
        merge: true

      # 3b) Capture another group (not 1)
      - label: "CAPTURE_GROUP_2"
        pattern: "(Client)\\s*:?\\s*([A-Z0-9_-]+)"
        method: "regex"
        group: 2
        merge: true

      # 3c) strip_spaces for OCR numbers like "12 345,67"
      - label: "AMOUNT_RAW"
        pattern: "Amount\\s*:?\\s*([\\d\\s.,]+)\\s*(EUR|€)"
        method: "regex"
        group: 1
        strip_spaces: true
        merge: true

      # 3d) extract_after with regex (you use it in your config)
      - label: "NUMBER_THEN_READ_AFTER"
        pattern: "Line\\s*No\\s*:?\\s*([0-9]+)"
        method: "regex"
        group: 1
        extract_after: 5
        merge: true


  # ===========================================================================
  # 4) REGEX FALLBACKS: patterns list (try several regexes), merge true vs false
  # ===========================================================================
  regex_fallbacks_and_multi_hits:
    match: "^RFX_.*\\.json$"
    parse_title: true
    tokens:
      # 4a) patterns: multiple regex candidates for the same logical field
      - label: "DATE_FALLBACK"
        patterns:
          - "Date\\s*:?\\s*(\\d{2}/\\d{2}/\\d{4})"
          - "Date\\s*:?\\s*(\\d{1,2}\\s+\\w+\\s+\\d{4})"
          - "Dated\\s*:?\\s*(\\d{2}-\\d{2}-\\d{4})"
        method: "regex"
        group: 1
        merge: true

      # 4b) merge=false: keep all matches (line items / repeated fields)
      - label: "ITEM_CODES_ALL"
        pattern: "\\bItem\\b\\s*:?\\s*([A-Z]{2}[0-9]{3})"
        method: "regex"
        group: 1
        merge: false


  # ===========================================================================
  # 5) VALID_AMOUNT: show "valid_amount" filter for money-like values
  # ===========================================================================
  amount_validation:
    match: "^AMT_.*\\.json$"
    parse_title: true
    tokens:
      - label: "AMOUNT_VALIDATED"
        patterns:
          - "(?<!\\d)(\\d{1,3}(?:\\s\\d{3})*[.,]\\d{2})(?![\\d.,])"
          - "(?<!\\d)(\\d+[.,]\\d{2})(?![\\d.,])"
        method: "regex"
        group: 1
        strip_spaces: true
        valid_amount: true
        merge: false


  # ===========================================================================
  # 6) FUZZY: threshold, pattern vs patterns, merge true vs false
  # ===========================================================================
  fuzzy_showcase:
    match: "^FUZ_.*\\.json$"
    parse_title: true
    tokens:
      # 6a) Single fuzzy anchor, strict threshold
      - label: "HEADER_NEAR_MATCH"
        pattern: "Description :"
        method: "fuzzy"
        threshold: 88
        extract_after: 80
        merge: true

      # 6b) Multiple fuzzy anchors, slightly looser threshold
      - label: "SYNONYM_NEAR_MATCH"
        patterns:
          - "Requester :"
          - "Requestor :"
          - "Demandeur :"
          - "Demandeuse :"
        method: "fuzzy"
        threshold: 82
        extract_after: 40
        merge: true

      # 6c) merge=false for fuzzy: keep multiple candidate hits (if your engine returns them)
      - label: "MULTI_FUZZY_CANDIDATES"
        pattern: "Observations :"
        method: "fuzzy"
        threshold: 80
        extract_after: 120
        merge: false


  # ===========================================================================
  # 7) MIXED REALISTIC: combine kmp + regex + fuzzy, plus multi-hit series
  # ===========================================================================
  mixed_methods_series:
    match: "^MIX_.*\\.json$"
    parse_title: true
    tokens:
      # KMP anchor -> read after
      - label: "DOC_REFERENCE"
        patterns:
          - "Document ref :"
          - "Document reference :"
          - "Référence document :"
        method: "kmp"
        extract_after: 30
        merge: true

      # Regex code
      - label: "PROJECT_CODE"
        pattern: "Project\\s*:?\\s*([A-Z0-9_-]+)"
        method: "regex"
        group: 1
        merge: true

      # Fuzzy text block (OCR-friendly)
      - label: "FREE_TEXT_BLOCK"
        pattern: "Work description :"
        method: "fuzzy"
        threshold: 83
        extract_after: 150
        merge: true

      # Multi-hit series: capture repeated quantities
      - label: "QTY_LIST"
        patterns:
          - "\\bQty\\b\\s*:?\\s*([\\d\\s]+)"
        method: "regex"
        group: 1
        strip_spaces: true
        merge: false

      # Multi-hit series: capture repeated unit prices
      - label: "UNIT_PRICE_LIST"
        patterns:
          - "\\bUnit\\s*price\\b\\s*:?\\s*(\\d[\\d\\s]*[,.;]\\d{2})\\s*(?:EUR|€)"
        method: "regex"
        group: 1
        strip_spaces: true
        merge: false

      # Multi-hit series: capture repeated totals (and validate they look like amounts)
      - label: "LINE_TOTAL_LIST_VALIDATED"
        patterns:
          - "\\bLine\\s*total\\b\\s*:?\\s*(\\d[\\d\\s]*[,.;]\\d{2})\\s*(?:EUR|€)"
        method: "regex"
        group: 1
        strip_spaces: true
        valid_amount: true
        merge: false


  # ===========================================================================
  # 8) PARSE_TITLE: split the filename itself into structured metadata fields
  #    Requires parse_title: true on the document type.
  #    token_finder.parse_title() splits filename (without extension) on "_".
  #    e.g. "KMP_PO_2024_ACME.json" → ["KMP", "PO", "2024", "ACME"]
  #    The split parts land in json_doc["metadata"]["title"] (list).
  #    The extension lands in json_doc["metadata"]["file_extension"].
  #    No token entries are needed to trigger this — parse_title: true is enough.
  # ===========================================================================
  parse_title_showcase:
    match: "^TITLE_.*\\.json$"
    parse_title: true
    tokens:
      # Regular tokens still run alongside title parsing
      - label: "BODY_REFERENCE"
        pattern: "Reference\\s*:?\\s*([A-Z0-9_-]+)"
        method: "regex"
        group: 1
        merge: true


  # ===========================================================================
  # 9) EDGE CASES: guard rails and boundary conditions
  # ===========================================================================
  edge_cases:
    match: "^EDGE_.*\\.json$"
    parse_title: false
    tokens:
      # 9a) KMP with extract_after=0: presence marker only — pos is recorded,
      #     values list will be empty (used to flag that a keyword exists)
      - label: "KEYWORD_PRESENT"
        pattern: "CONFIDENTIAL"
        method: "kmp"
        extract_after: 0
        merge: false

      # 9b) Regex group=0: capture the full match (no sub-group needed)
      - label: "FULL_MATCH_CAPTURE"
        pattern: "\\bINV-[A-Z]{2}[0-9]{4}\\b"
        method: "regex"
        group: 0
        merge: false

      # 9c) Fuzzy with high threshold: near-exact match only (OCR single char error)
      - label: "STRICT_FUZZY"
        pattern: "Total amount due :"
        method: "fuzzy"
        threshold: 95
        extract_after: 20
        merge: true

      # 9d) Fuzzy with low threshold: tolerant match for heavily degraded scans
      - label: "LOOSE_FUZZY"
        pattern: "Observations :"
        method: "fuzzy"
        threshold: 70
        extract_after: 100
        merge: false

      # 9e) valid_amount acts as a post-filter: values outside [480.0, 100000.0]
      #     are silently discarded (value set to ""), so values list may be sparse
      - label: "FILTERED_AMOUNT"
        pattern: "(?<!\\d)(\\d{1,3}(?:\\s\\d{3})*[.,]\\d{2})(?![\\d.,])"
        method: "regex"
        group: 1
        strip_spaces: true
        valid_amount: true
        merge: false
